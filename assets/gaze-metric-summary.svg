<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">시선 추적 마우스 내부 평가 요약</title>
  <desc id="desc">개별 이미지 무작위 분할에서 기록한 validation MAE 66.77 픽셀, test MAE 67.71 픽셀, 실행 속도 22에서 24 FPS를 내부 참고값으로 표시</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#29245c"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" rx="32" fill="url(#bg)"/>
  <text x="64" y="70" fill="#f8fafc" font-family="Pretendard, Arial, sans-serif" font-size="34" font-weight="700">내부 평가 요약</text>
  <text x="64" y="107" fill="#a5b4fc" font-family="Pretendard, Arial, sans-serif" font-size="18">수업 프로젝트 당시 로컬 웹캠·화면 환경</text>

  <rect x="64" y="145" width="330" height="210" rx="24" fill="#172033" stroke="#334155"/>
  <text x="95" y="190" fill="#94a3b8" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="600">VALIDATION MAE</text>
  <text x="95" y="255" fill="#67e8f9" font-family="Pretendard, Arial, sans-serif" font-size="52" font-weight="800">66.77 px</text>
  <rect x="95" y="290" width="255" height="14" rx="7" fill="#334155"/>
  <rect x="95" y="290" width="170" height="14" rx="7" fill="url(#bar1)"/>
  <text x="95" y="330" fill="#cbd5e1" font-family="Pretendard, Arial, sans-serif" font-size="15">로그 원값 66.7715</text>

  <rect x="435" y="145" width="330" height="210" rx="24" fill="#172033" stroke="#334155"/>
  <text x="466" y="190" fill="#94a3b8" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="600">TEST MAE</text>
  <text x="466" y="255" fill="#c4b5fd" font-family="Pretendard, Arial, sans-serif" font-size="52" font-weight="800">67.71 px</text>
  <rect x="466" y="290" width="255" height="14" rx="7" fill="#334155"/>
  <rect x="466" y="290" width="173" height="14" rx="7" fill="url(#bar2)"/>
  <text x="466" y="330" fill="#cbd5e1" font-family="Pretendard, Arial, sans-serif" font-size="15">독립 사용자 benchmark 아님</text>

  <rect x="806" y="145" width="330" height="210" rx="24" fill="#172033" stroke="#334155"/>
  <text x="837" y="190" fill="#94a3b8" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="600">RUNTIME</text>
  <text x="837" y="255" fill="#f9a8d4" font-family="Pretendard, Arial, sans-serif" font-size="52" font-weight="800">22–24 FPS</text>
  <rect x="837" y="290" width="255" height="14" rx="7" fill="#334155"/>
  <rect x="837" y="290" width="223" height="14" rx="7" fill="url(#bar2)"/>
  <text x="837" y="330" fill="#cbd5e1" font-family="Pretendard, Arial, sans-serif" font-size="15">10초 구간 평균 로그 23.5</text>

  <rect x="64" y="390" width="1072" height="82" rx="18" fill="#451a03" stroke="#f59e0b" stroke-opacity="0.65"/>
  <text x="92" y="425" fill="#fbbf24" font-family="Pretendard, Arial, sans-serif" font-size="18" font-weight="700">해석 경계</text>
  <text x="92" y="452" fill="#fde68a" font-family="Pretendard, Arial, sans-serif" font-size="16">개별 이미지 무작위 분할 · 같은 표적의 근접 프레임이 split 사이에 섞였을 가능성 · 내부 참고값</text>
</svg>
