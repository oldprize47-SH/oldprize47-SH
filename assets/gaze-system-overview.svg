<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">시선 추적 마우스 처리 흐름</title>
  <desc id="desc">웹캠 영상에서 눈 영역을 추출하고 시선 회귀와 사용자 보정을 거쳐 포인터 이동과 깜빡임 클릭으로 연결하는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c4b5fd"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <circle cx="1090" cy="80" r="190" fill="#8b5cf6" opacity="0.08"/>
  <circle cx="110" cy="680" r="220" fill="#06b6d4" opacity="0.07"/>

  <text x="68" y="76" fill="#f8fafc" font-family="Pretendard, Arial, sans-serif" font-size="36" font-weight="700">시선 추적 마우스</text>
  <text x="68" y="114" fill="#a5b4fc" font-family="Pretendard, Arial, sans-serif" font-size="19">웹캠 입력에서 포인터 이동·깜빡임 클릭까지</text>

  <g filter="url(#shadow)">
    <rect x="68" y="195" width="200" height="128" rx="20" fill="#1e293b" stroke="#64748b"/>
    <text x="168" y="236" fill="#cbd5e1" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="600">입력</text>
    <text x="168" y="272" fill="#ffffff" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="24" font-weight="700">웹캠 프레임</text>
    <text x="168" y="301" fill="#94a3b8" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="15">얼굴 · 양안 영상</text>

    <rect x="326" y="195" width="215" height="128" rx="20" fill="#1e293b" stroke="#64748b"/>
    <text x="434" y="236" fill="#cbd5e1" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="600">전처리</text>
    <text x="434" y="271" fill="#ffffff" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="22" font-weight="700">FaceMesh</text>
    <text x="434" y="301" fill="#94a3b8" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="15">눈 ROI · 224×224</text>

    <rect x="600" y="170" width="300" height="178" rx="26" fill="url(#model)"/>
    <text x="750" y="213" fill="#ede9fe" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="600">시선 회귀 모델</text>
    <text x="750" y="254" fill="#ffffff" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="25" font-weight="700">CNN + Transformer</text>
    <line x1="650" y1="275" x2="850" y2="275" stroke="#ddd6fe" opacity="0.7"/>
    <text x="750" y="309" fill="#f5f3ff" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="16">EfficientNet · Swin-T · CBAM</text>
    <text x="750" y="333" fill="#ddd6fe" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="15">2차원 (dx, dy)</text>

    <rect x="958" y="195" width="175" height="128" rx="20" fill="#1e293b" stroke="#64748b"/>
    <text x="1046" y="236" fill="#cbd5e1" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="600">사용자 보정</text>
    <text x="1046" y="272" fill="#ffffff" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="21" font-weight="700">화면 좌표화</text>
    <text x="1046" y="301" fill="#94a3b8" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="15">최소제곱 · 평활</text>

    <rect x="185" y="485" width="360" height="145" rx="24" fill="#0f766e"/>
    <text x="365" y="528" fill="#ccfbf1" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="600">GAZE OUTPUT</text>
    <text x="365" y="570" fill="#ffffff" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="27" font-weight="700">포인터 이동</text>
    <text x="365" y="604" fill="#ccfbf1" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="16">화면 제한 · 지수 평활</text>

    <rect x="655" y="485" width="360" height="145" rx="24" fill="#be185d"/>
    <text x="835" y="528" fill="#fce7f3" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="600">BLINK OUTPUT</text>
    <text x="835" y="570" fill="#ffffff" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="27" font-weight="700">시선 고정 + 클릭</text>
    <text x="835" y="604" fill="#fce7f3" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="16">양안 EAR · 연속 프레임 판정</text>
  </g>

  <g fill="none" stroke="#c4b5fd" stroke-width="4" marker-end="url(#arrow)">
    <path d="M268 259 H306"/>
    <path d="M541 259 H580"/>
    <path d="M900 259 H938"/>
    <path d="M1046 323 V405 H365 V465"/>
    <path d="M434 323 V405 H835 V465"/>
  </g>
  <text x="705" y="396" fill="#c4b5fd" font-family="Pretendard, Arial, sans-serif" font-size="16" font-weight="600">시선 좌표</text>
  <text x="548" y="430" fill="#f9a8d4" font-family="Pretendard, Arial, sans-serif" font-size="16" font-weight="600">눈 랜드마크 · EAR</text>
</svg>
