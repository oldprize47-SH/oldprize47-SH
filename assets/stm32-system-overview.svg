<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">STM32 자동 분리수거 시스템 개요</title>
  <desc id="desc">바코드와 적외선 센서를 처리하는 분류 제어 보드가 모터와 도어를 구동하고, UART로 적재량 감시 보드에 사용자 정보를 전달하는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="board1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="board2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <circle cx="1090" cy="90" r="180" fill="#2563eb" opacity="0.08"/>
  <circle cx="90" cy="650" r="210" fill="#14b8a6" opacity="0.07"/>

  <text x="70" y="75" fill="#f8fafc" font-family="Pretendard, Arial, sans-serif" font-size="36" font-weight="700">STM32 자동 분리수거 시스템</text>
  <text x="70" y="112" fill="#94a3b8" font-family="Pretendard, Arial, sans-serif" font-size="19">2개 MCU가 분류·구동과 적재량 감시를 분담하는 구조</text>

  <g filter="url(#shadow)">
    <rect x="70" y="175" width="235" height="92" rx="18" fill="#1e293b" stroke="#475569"/>
    <text x="188" y="211" fill="#cbd5e1" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="600">사용자·제품 입력</text>
    <text x="188" y="240" fill="#f8fafc" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="21">바코드 스캐너</text>

    <rect x="70" y="302" width="235" height="92" rx="18" fill="#1e293b" stroke="#475569"/>
    <text x="188" y="338" fill="#cbd5e1" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="600">투입 감지</text>
    <text x="188" y="367" fill="#f8fafc" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="21">IR 센서</text>

    <rect x="385" y="180" width="330" height="220" rx="26" fill="url(#board1)"/>
    <text x="550" y="222" fill="#dbeafe" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="18" font-weight="600">BOARD 1 · NUCLEO-F411RE</text>
    <text x="550" y="263" fill="#ffffff" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="30" font-weight="700">분류 제어기</text>
    <line x1="435" y1="286" x2="665" y2="286" stroke="#bfdbfe" opacity="0.6"/>
    <text x="550" y="325" fill="#eff6ff" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="18">사용자 확인 · 품목 분류 · 상태 전이</text>
    <text x="550" y="356" fill="#dbeafe" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="16">USART · ADC · PWM · GPIO</text>

    <rect x="895" y="175" width="235" height="92" rx="18" fill="#1e293b" stroke="#475569"/>
    <text x="1013" y="211" fill="#cbd5e1" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="600">분류·투입 구동</text>
    <text x="1013" y="240" fill="#f8fafc" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="19">스테퍼 2 · 서보 1</text>

    <rect x="895" y="302" width="235" height="92" rx="18" fill="#1e293b" stroke="#475569"/>
    <text x="1013" y="338" fill="#cbd5e1" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="600">상태 표시</text>
    <text x="1013" y="367" fill="#f8fafc" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="20">LED · Debug UART</text>

    <rect x="385" y="480" width="330" height="165" rx="26" fill="url(#board2)"/>
    <text x="550" y="520" fill="#ccfbf1" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="18" font-weight="600">BOARD 2 · NUCLEO-F411RE</text>
    <text x="550" y="559" fill="#ffffff" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="29" font-weight="700">적재량 감시기</text>
    <text x="550" y="598" fill="#ecfdf5" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="17">거리 계산 · 포인트/만재 상태 갱신</text>

    <rect x="70" y="510" width="235" height="105" rx="18" fill="#1e293b" stroke="#475569"/>
    <text x="188" y="548" fill="#cbd5e1" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="600">적재 높이 측정</text>
    <text x="188" y="579" fill="#f8fafc" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="20">초음파 센서 × 3</text>

    <rect x="895" y="510" width="235" height="105" rx="18" fill="#1e293b" stroke="#475569"/>
    <text x="1013" y="548" fill="#cbd5e1" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="600">외부 상태 전달</text>
    <text x="1013" y="579" fill="#f8fafc" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="20">Bluetooth · UART</text>
  </g>

  <g fill="none" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)">
    <path d="M305 221 H365"/>
    <path d="M305 348 H365"/>
    <path d="M715 221 H875"/>
    <path d="M715 348 H875"/>
    <path d="M305 562 H365"/>
    <path d="M715 562 H875"/>
    <path d="M550 400 V458"/>
  </g>
  <text x="573" y="444" fill="#bfdbfe" font-family="Pretendard, Arial, sans-serif" font-size="16" font-weight="600">USART1 · 사용자 인덱스</text>
</svg>
